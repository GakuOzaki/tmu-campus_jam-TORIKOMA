5rem", "margin-desktop": "2.5rem", "space-lg": "1.25rem", "gutter": "1rem" }, fontFamily: { "headline-sm": ["Noto Sans"], "body-md": ["Noto Sans"], "body-sm": ["Noto Sans"], "body-lg": ["Noto Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Noto Sans"], "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] }, fontSize: { "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "700" }], "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }], "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "700" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "headline-lg": ["30px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "700" }], "display-lg": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "800" }], "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }], "label-sm": ["10px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f8f9fa;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full pb-safe">
<!-- Dynamic Ambient Glow Layer -->
<div class="relative w-full overflow-hidden px-margin pt-space-md">
<div class="absolute -top-12 -right-12 w-48 h-48 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-24 -left-10 w-40 h-40 bg-secondary-container/20 rounded-full blur-2xl pointer-events-none"></div>
<!-- Header Section -->
<div class="relative flex flex-col gap-space-xs mb-space-lg">
<div class="inline-flex items-center gap-space-xs self-start px-space-md py-space-xs rounded-full bg-primary-fixed text-on-primary-fixed-variant shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-sm text-label-sm tracking-wide">CAMPUS SYLLABUS HUB</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mt-space-xs">
        学部・学科を選択
      </h1>
</div>
<!-- Visual Canvas Card (Preview Banner) -->
<!-- Interactive Selection Form -->
<div class="flex flex-col gap-space-md mb-space-xl gap-space-lg">
<!-- Faculty Selection Block -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-space-xs">
<span class="w-2 h-2 rounded-full bg-primary"></span>
            学部を選択
          </label>
<span class="font-label-sm text-label-sm text-primary font-bold">必須</span>
</div>
<!-- Custom Dropdown Container -->
<div class="relative">
<select class="w-full h-12 pl-space-lg pr-10 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm appearance-none outline-none focus:bg-surface-container-lowest transition-all cursor-pointer" id="facultySelect">
<option disabled="" selected="" value="">学部を選択してください</option>
<option data-courses="142" value="cs">情報理工学部</option>
<option data-courses="118" value="sci">理工学部</option>
<option data-courses="89" value="lit">文学部</option>
<option data-courses="134" value="econ">経済学部</option>
<option data-courses="96" value="law">法学部</option>
<option data-courses="75" value="med">総合生命科学部</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-md text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Quick Faculty Pill Chips (Moments of Delight: 1-Tap select) -->
<!-- Department Selection Block -->
<div class="flex flex-col gap-space-xs mt-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-space-xs">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
            学科を選択
          </label>
<span class="font-label-sm text-label-sm text-primary font-bold">必須</span>
</div>
<!-- Custom Dropdown Container -->
<div class="relative">
<select class="w-full h-12 pl-space-lg pr-10 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm appearance-none outline-none focus:bg-surface-container-lowest transition-all cursor-pointer disabled:bg-surface-container-high disabled:text-outline disabled:cursor-not-allowed" disabled="" id="deptSelect">
<option disabled="" selected="" value="">まず学部を選択してください</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-md text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Live Course Count Preview Card -->
</div>
<!-- Visual Sticky / Grounded Primary CTA Action -->
<div class="w-full flex flex-col gap-space-xs mb-space-xl">
<button class="w-full h-12 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md transition-all duration-200 active:scale-[0.985] disabled:opacity-40 disabled:cursor-not-allowed" disabled="" id="submitBtn" type="button">
<span>この学部の講義を見る</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-1">
        ※ 選択した情報は後からいつでも変更可能です
      </p>
</div>
</div>
</div>
<script>
  // Department database scoped per Faculty
  const departmentCatalog = {
    cs: [
      { id: 'cs_sys', name: '情報システム学科', courses: 54 },
      { id: 'cs_media', name: 'メディア情報学科', courses: 46 },
      { id: 'cs_comp', name: 'コンピュータ応用学科', courses: 42 }
    ],
    sci: [
      { id: 'sci_phys', name: '物理学科', courses: 38 },
      { id: 'sci_chem', name: '化学・生命科学科', courses: 41 },
      { id: 'sci_math', name: '数理科学科', courses: 39 }
    ],
    lit: [
      { id: 'lit_jp', name: '日本文学科', courses: 32 },
      { id: 'lit_eng', name: '英米文学科', courses: 31 },
      { id: 'lit_hist', name: '歴史文化学科', courses: 26 }
    ],
    econ: [
      { id: 'econ_econ', name: '現代経済学科', courses: 48 },
      { id: 'econ_biz', name: '国際商経学科', courses: 44 },
      { id: 'econ_fin', name: 'ファイナンス学科', courses: 42 }
    ],
    law: [
      { id: 'law_law', name: '法律学科', courses: 52 },
      { id: 'law_policy', name: '公共政策学科', courses: 44 }
    ],
    med: [
      { id: 'med_life', name: '先端生命医科学科', courses: 38 },
      { id: 'med_bio', name: 'バイオインフォマティクス学科', courses: 37 }
    ]
  };

  const facultySelect = document.getElementById('facultySelect');
  const deptSelect = document.getElementById('deptSelect');
  const courseCount = document.getElementById('courseCount');
  const selectedLabel = document.getElementById('selectedLabel');
  const submitBtn = document.getElementById('submitBtn');
  const featureBadges = document.getElementById('featureBadges');
  const badgeIconBox = document.getElementById('badgeIconBox');

  function updateDepartmentOptions(facKey) {
    deptSelect.innerHTML = '<option value="" disabled selected>学科を選択してください</option>';
    if (departmentCatalog[facKey]) {
      deptSelect.disabled = false;
      departmentCatalog[facKey].forEach(dept => {
        const opt = document.createElement('option');
        opt.value = dept.id;
        opt.dataset.count = dept.courses;
        opt.textContent = dept.name;
        deptSelect.appendChild(opt);
      });
      // Set preview to total faculty count first
      const total = departmentCatalog[facKey].reduce((acc, cur) => acc + cur.courses, 0);
      animateCount(total);
      const facName = facultySelect.options[facultySelect.selectedIndex].text;
      selectedLabel.textContent = facName + ' (全体)';
      featureBadges.classList.remove('opacity-40');
      featureBadges.classList.add('opacity-100');
    } else {
      deptSelect.disabled = true;
      animateCount(0);
      selectedLabel.textContent = '学部・学科を選択中';
      featureBadges.classList.add('opacity-40');
      featureBadges.classList.remove('opacity-100');
    }
    validateSelection();
  }

  function animateCount(target) {
    let current = parseInt(courseCount.innerText, 10) || 0;
    const diff = target - current;
    const duration = 240;
    const steps = 12;
    let stepCount = 0;
    
    if (target === 0) {
      courseCount.innerText = '0';
      return;
    }

    const timer = setInterval(() => {
      stepCount++;
      current += Math.round(diff / steps);
      courseCount.innerText = current;
      if (stepCount >= steps) {
        clearInterval(timer);
        courseCount.innerText = target;
      }
    }, duration / steps);
  }

  function validateSelection() {
    if (facultySelect.value && deptSelect.value) {
      submitBtn.disabled = false;
      badgeIconBox.classList.remove('bg-primary-fixed', 'text-primary');
      badgeIconBox.classList.add('bg-secondary-container', 'text-on-secondary-container');
    } else {
      submitBtn.disabled = true;
      badgeIconBox.classList.add('bg-primary-fixed', 'text-primary');
      badgeIconBox.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    }
  }

  function quickSelectFaculty(facKey) {
    facultySelect.value = facKey;
    updateDepartmentOptions(facKey);
    // highlight selected chip
    document.querySelectorAll('.faculty-chip').forEach(chip => {
      chip.classList.remove('bg-primary', 'text-on-primary');
      chip.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
    });
    event.currentTarget.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
    event.currentTarget.classList.add('bg-primary', 'text-on-primary');
  }

  facultySelect.addEventListener('change', (e) => {
    updateDepartmentOptions(e.target.value);
  });

  deptSelect.addEventListener('change', (e) => {
    const selectedOption = deptSelect.options[deptSelect.selectedIndex];
    const deptCourseCount = parseInt(selectedOption.dataset.count, 10) || 0;
    const facName = facultySelect.options[facultySelect.selectedIndex].text;
    const deptName = selectedOption.text;
    
    selectedLabel.textContent = facName + ' / ' + deptName;
    animateCount(deptCourseCount);
    validateSelection();
  });

  submitBtn.addEventListener('click', () => {
    submitBtn.classList.add('scale-95');
    setTimeout(() => {
      submitBtn.classList.remove('scale-95');
      const facText = facultySelect.options[facultySelect.selectedIndex]?.text;
      const deptText = deptSelect.options[deptSelect.selectedIndex]?.text;
      if (facText && deptText) {
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>講義を読み込み中...</span>';
      }
    }, 150);
  });
</script></main></body></html>
